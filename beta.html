<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>DF Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, 'Noto Sans Thai', BlinkMacSystemFont, sans-serif;
      background: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10vh 20px 28px;
      color: #1a1a2e;
    }

    .app-icon {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.18);
      margin-bottom: 12px;
    }

    .app-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #c026d3, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .app-tagline {
      font-size: 13px;
      color: #6b5b8a;
      text-align: center;
      margin-bottom: 10px;
    }

    .ios-pill {
      background: #f5f3ff;
      border: 1px solid #ede9fe;
      color: #7c3aed;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 100px;
      margin-bottom: 28px;
    }

    /* Timeline wrapper */
    .timeline {
      width: 100%;
      max-width: 360px;
      display: flex;
      gap: 0;
      margin-bottom: 16px;
    }

    /* Left track */
    .track {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 18px;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .track-dot-fill {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #7c3aed;
      flex-shrink: 0;
    }

    .track-line {
      width: 2px;
      flex: 1;
      background: linear-gradient(to bottom, #7c3aed 0%, #ddd6fe 100%);
      min-height: 28px;
    }

    .track-dot-empty {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid #7c3aed;
      background: white;
      flex-shrink: 0;
    }

    /* Buttons */
    .steps {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: flex;
      align-items: center;
      padding: 15px 16px;
      border-radius: 13px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active { opacity: 0.85; }

    .btn-primary {
      background: #7c3aed;
      color: white;
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.28);
    }

    .btn-secondary {
      background: white;
      color: #7c3aed;
      border: 1.5px solid #ede9fe;
    }

    .btn-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 12px;
    }

    .btn-primary .btn-badge {
      background: rgba(255,255,255,0.2);
      color: white;
    }

    .btn-secondary .btn-badge {
      background: #ede9fe;
      color: #7c3aed;
    }

    .btn-label { flex: 1; }

    .btn-title {
      font-size: 15px;
      font-weight: 700;
      display: block;
    }

    .btn-sub {
      font-size: 11px;
      font-weight: 500;
      opacity: 0.65;
      margin-top: 2px;
      display: block;
    }

    .btn-arrow {
      font-size: 18px;
      opacity: 0.45;
      margin-left: 8px;
    }

    /* Warning */
    .warning {
      width: 100%;
      max-width: 360px;
      font-size: 12px;
      font-weight: 500;
      color: #aaa;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <img class="app-icon" src="icon.png" alt="DF Tracker">
  <div class="app-name">DF Tracker</div>
  <p class="app-tagline">แอปบันทึกรายได้สำหรับทันตแพทย์</p>
  <div class="ios-pill">พร้อมแล้วบน iOS · กำลังเปิดตัว Android</div>

  <div class="timeline">

    <!-- Left track -->
    <div class="track">
      <div class="track-dot-fill"></div>
      <div class="track-line"></div>
      <div class="track-dot-empty"></div>
    </div>

    <!-- Buttons -->
    <div class="steps">
      <a class="btn btn-primary" href="https://groups.google.com/g/df-tracker" target="_blank">
        <div class="btn-badge">1</div>
        <div class="btn-label">
          <span class="btn-title">เข้าร่วมกลุ่มทดสอบ</span>
          <span class="btn-sub">กด "Join group" แล้วกลับมากดข้อ 2</span>
        </div>
        <span class="btn-arrow">›</span>
      </a>

      <a class="btn btn-secondary" href="https://play.google.com/apps/testing/th.co.dftracker" target="_blank">
        <div class="btn-badge">2</div>
        <div class="btn-label">
          <span class="btn-title">ดาวน์โหลดบน Google Play</span>
          <span class="btn-sub">กด "Become a tester" แล้วติดตั้ง</span>
        </div>
        <span class="btn-arrow">›</span>
      </a>
    </div>

  </div>

  <p class="warning">⚠️ ต้อง login Google Play ด้วย Gmail เดียวกับที่กด Join กลุ่ม ไม่งั้นโหลดไม่ได้</p>

</body>
</html>
